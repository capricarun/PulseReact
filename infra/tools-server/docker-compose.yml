# DevOps tools that run next to Jenkins on the tools EC2 instance:
#   SonarQube Community Build (+ PostgreSQL)  -> http://<EC2_PUBLIC_IP>:9000
#   Nexus Repository Community Edition        -> http://<EC2_PUBLIC_IP>:8081 (UI), port 8083 (Docker registry)
# Usage on the server:  cd /opt/devops-tools && docker compose up -d
name: devops-tools

services:
  sonarqube-db:
    image: postgres:17
    container_name: sonarqube-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: ${SONAR_DB_PASSWORD:?set SONAR_DB_PASSWORD in /opt/devops-tools/.env}
      POSTGRES_DB: sonarqube
    volumes:
      - sonarqube-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sonar -d sonarqube"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [tools]

  sonarqube:
    image: sonarqube:26.9.0.129388-community
    container_name: sonarqube
    restart: unless-stopped
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://sonarqube-db:5432/sonarqube
      SONAR_JDBC_USERNAME: sonar
      SONAR_JDBC_PASSWORD: ${SONAR_DB_PASSWORD}
    ports:
      - "9000:9000"
    volumes:
      - sonarqube-data:/opt/sonarqube/data
      - sonarqube-extensions:/opt/sonarqube/extensions
      - sonarqube-logs:/opt/sonarqube/logs
      - sonarqube-temp:/opt/sonarqube/temp
    tmpfs:
      - /tmp:size=256M,mode=1777
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
      nproc:
        soft: 8192
        hard: 8192
    networks: [tools]

  nexus:
    image: sonatype/nexus3:3.96.1
    container_name: nexus
    restart: unless-stopped
    environment:
      INSTALL4J_ADD_VM_PARAMS: "-Xms1g -Xmx2g -XX:MaxDirectMemorySize=1g -Djava.util.prefs.userRoot=/nexus-data/javaprefs"
    ports:
      - "8081:8081" # web UI and REST API
      - "8083:8083" # Docker hosted repository (HTTP connector you create in the UI)
    volumes:
      - nexus-data:/nexus-data
    stop_grace_period: 2m
    networks: [tools]

volumes:
  sonarqube-db:
  sonarqube-data:
  sonarqube-extensions:
  sonarqube-logs:
  sonarqube-temp:
  nexus-data:

networks:
  tools:
