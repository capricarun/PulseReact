# Helm values for grafana/alloy - collects logs from every pod through the Kubernetes API
# (no host paths, runs as non-root) plus Kubernetes events, and pushes them to Loki.
controller:
  type: deployment # one collector is enough for a small cluster
  replicas: 1

alloy:
  securityContext:
    runAsNonRoot: true
    runAsUser: 473 # "alloy" user inside the image
    runAsGroup: 473
    allowPrivilegeEscalation: false
    capabilities:
      drop: ["ALL"]
    seccompProfile:
      type: RuntimeDefault
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi
  configMap:
    create: true
    content: |
      // 1) Find pods in the namespaces we care about
      discovery.kubernetes "pods" {
        role = "pod"
        namespaces {
          names = ["pulse", "kube-system", "monitoring", "logging", "external-secrets"]
        }
      }

      // 2) Turn Kubernetes metadata into Loki labels: namespace, pod, container, app
      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app_kubernetes_io_name"]
          target_label  = "app"
        }
      }

      // 3) Tail container logs through the Kubernetes API
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.default.receiver]
      }

      // 4) Kubernetes events (scheduling, image pulls, failed probes, OOMKilled, rollouts)
      loki.source.kubernetes_events "events" {
        namespaces = ["pulse"]
        job_name   = "kubernetes-events"
        forward_to = [loki.write.default.receiver]
      }

      // 5) Ship everything to Loki
      loki.write "default" {
        endpoint {
          url = "http://loki.logging.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

# Least privilege: only what log collection needs (the chart default also allows reading Secrets)
rbac:
  create: true
  rules:
    - apiGroups: [""]
      resources: ["pods", "pods/log", "namespaces", "events"]
      verbs: ["get", "list", "watch"]
  clusterRules: []
