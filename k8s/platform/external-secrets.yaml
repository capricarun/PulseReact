# Secrets live in AWS Secrets Manager (encrypted with KMS) - never in Git, Dockerfiles or manifests.
# External Secrets Operator reads them with its EKS Pod Identity role and keeps a Kubernetes Secret in sync.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: pulse
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1 # change if you use another region
      # No "auth" block: the controller's EKS Pod Identity credentials are used
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pulse-app-secrets
  namespace: pulse
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: pulse-app-secrets # Kubernetes Secret created and owned by ESO
    creationPolicy: Owner
  dataFrom:
    # Copies every key of the JSON secret: MYSQL_ROOT_PASSWORD, DB_PASSWORD, JWT_SECRET
    - extract:
        key: pulse/prod/app
