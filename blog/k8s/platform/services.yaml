# Stable Services for the app tiers. Applied once by the platform admin (not by the pipeline),
# because the pipeline's RBAC role is not allowed to create or change Services (prevents traffic hijacking).
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: blog
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: blog
spec:
  type: ClusterIP # internal only - reachable by the frontend pods, never from the internet
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 4000
      targetPort: 4000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: blog
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: blog
spec:
  type: ClusterIP # exposed to the internet only through the ALB Ingress
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: 8080
