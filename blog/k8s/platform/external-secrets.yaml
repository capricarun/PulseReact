# Secrets live in AWS Secrets Manager (encrypted with KMS) - never in Git, Dockerfiles or manifests.
# External Secrets Operator reads them with its EKS Pod Identity role and keeps a Kubernetes Secret in sync.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: blog
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1 # change if you use another region
      # No "auth" block: the controller's EKS Pod Identity credentials are used
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: blog
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-south-1
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: blog-app-secrets
  namespace: blog
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: blog-app-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: pulse/blog/app
