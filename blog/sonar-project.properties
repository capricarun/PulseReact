# SonarQube analysis settings for the Marginal blog (read by sonar-scanner from the blog/ folder)
sonar.projectKey=marginal-blog
sonar.projectName=Marginal - Three-Tier Blog App
sonar.sourceEncoding=UTF-8

sonar.sources=backend/server.js,backend/src,frontend/src
sonar.tests=backend/test,frontend/test
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Backend test coverage produced by "npm test" (Node.js test runner, LCOV; paths prefixed with backend/ by the pipeline)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
# The React UI has no unit tests: analysed for bugs and code smells, but excluded from the coverage figure
sonar.coverage.exclusions=frontend/**
