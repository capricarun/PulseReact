# SonarQube analysis settings (read by sonar-scanner from the repository root)
sonar.projectKey=pulse-app
sonar.projectName=Pulse - Three-Tier Blog App
sonar.sourceEncoding=UTF-8

# Application code of both components
sonar.sources=backend/server.js,backend/src,frontend/src
sonar.tests=backend/test,frontend/test
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**

# Backend test coverage produced by "npm test" (Node.js test runner, LCOV format)
sonar.javascript.lcov.reportPaths=backend/coverage/lcov.info
# The React UI has no unit tests yet: it is still analysed for bugs, vulnerabilities and code smells,
# but excluded from the coverage figure so UI changes are not blocked by a 0% coverage metric.
sonar.coverage.exclusions=frontend/**
